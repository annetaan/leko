name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Building the sandbox rewrites its generated vocabulary from the
      # reached() calls in it. Anything left over is a committed file that has
      # fallen behind the source it was gathered from.
      - run: pnpm build
      - run: git diff --exit-code
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test
