name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # The whole run is under two minutes when it is working. Without a limit of
    # its own a job gets GitHub's default of six hours, which is what a hung
    # browser cost here before anyone noticed it was not the tests being slow.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Building the sandbox rewrites its generated vocabulary from the
      # reached() calls in it. Anything left over is a committed file that has
      # fallen behind the source it was gathered from.
      - run: pnpm build
      - run: git diff --exit-code
      # A pull request's build is published nowhere else until it merges, so
      # this is the only rendered copy of its pages anyone can open. It goes up
      # once the build is known clean, so a later check failing leaves it there.
      # CONTRIBUTING.md, **The documentation site** says how to open it.
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: docs-site
          path: docs/dist
          retention-days: 14
      # A tarball can be broken while every other check here is green.
      # CONTRIBUTING.md, **What `@annetaan/leko` ships** says how it was twice.
      - run: pnpm check:pack
      # A link in the documentation site that does not land still builds, and
      # nothing else here fails on it. `docs/src/lib/href.ts` says why a link
      # written by hand is the one that goes wrong.
      - run: pnpm check:links
      # A comment that cites a heading instead of re-arguing it is the trade
      # DESIGN.md asks for under **Comments are the last place a fact goes**,
      # and it only holds while the pointer lands. Renaming a heading is the one
      # edit that breaks every citation of it at once, silently, in files
      # nobody opened.
      - run: pnpm check:citations
      # The reference is written by hand, so a name an entry point exports or a
      # property the code reads after a page was written still builds with no
      # page saying it exists, and so does a page documenting a renamed one.
      # `scripts/check-reference.mjs` says what counts as documented.
      - run: pnpm check:reference
      # Quint's own download of its evaluator goes without a token, and a shared
      # runner's address is past the anonymous limit often enough to fail a run
      # on that alone (`packages/machine/model/README.md`, **Running it**). This
      # puts the evaluator where Quint looks for it first, downloaded with this
      # run's token.
      - name: Fetch the Quint evaluator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('@informalsystems/quint/dist/src/rust/binaryManager.js').QUINT_EVALUATOR_VERSION")
          dir="$HOME/.quint/rust-evaluator-$version"
          mkdir -p "$dir"
          gh release download "evaluator/$version" --repo informalsystems/quint \
            --pattern quint_evaluator-x86_64-unknown-linux-gnu.tar.gz --output - \
            | tar -xz -C "$dir"
      # A search over the two Quint models — `packages/machine/model/machine.qnt`
      # and `packages/presenter/model/plan.qnt` — for a state that breaks one of
      # their invariants. The seeds are fresh every run, so a failure here is
      # not reproducible from this file: the run prints the seed that found it.
      # That is a fuzzer working, not flake.
      - run: pnpm model
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test
