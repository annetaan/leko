name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # The whole run is under two minutes when it is working. Without a limit of
    # its own a job gets GitHub's default of six hours, which is what a hung
    # browser cost here before anyone noticed it was not the tests being slow.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Building the sandbox rewrites its generated vocabulary from the
      # reached() calls in it. Anything left over is a committed file that has
      # fallen behind the source it was gathered from.
      - run: pnpm build
      - run: git diff --exit-code
      # The site has no public home until the release, so the build a pull
      # request made is the only rendered copy anyone can open. It goes up
      # before the checks that could fail, and CONTRIBUTING.md says how to open
      # it under **The documentation site**.
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: docs-site
          path: docs/dist
          retention-days: 14
      # Every bare import in a published package has to be something npm will
      # install. A workspace link is not: it resolves here and nowhere a
      # consumer is, which is how `@annetaan/leko` came to ship imports of two
      # packages that are not on the registry, with every other check green.
      - run: pnpm check:pack
      # A link in the documentation site that does not land still builds, and
      # nothing else here fails on it. `docs/src/lib/href.ts` says why a link
      # written by hand is the one that goes wrong.
      - run: pnpm check:links
      # A comment that cites a heading instead of re-arguing it is the trade
      # DESIGN.md asks for under **Comments are the last place a fact goes**,
      # and it only holds while the pointer lands. Renaming a heading is the one
      # edit that breaks every citation of it at once, silently, in files
      # nobody opened.
      - run: pnpm check:citations
      # A search over the two Quint models — `packages/machine/model/machine.qnt`
      # and `packages/presenter/model/plan.qnt` — for a state that breaks one of
      # their invariants. The seeds are fresh every run, so a failure here is
      # not reproducible from this file: the run prints the seed that found it.
      # That is a fuzzer working, not flake.
      - run: pnpm model
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test
