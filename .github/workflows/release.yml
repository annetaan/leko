name: Release

# Pushing a `v<version>` tag publishes `@annetaan/leko` and
# `@annetaan/leko-codegen` at that version. CONTRIBUTING.md, **The release**
# says what each job does.
#
# What has to be true before the first tag, as npm stood when this was written:
#
# 1. `@annetaan/leko-codegen@0.0.0` is on the registry, published by hand as a
#    placeholder with no code, the way `@annetaan/leko@0.0.0` was. npm sets up
#    a trusted publisher only on a package that already exists.
# 2. Trusted Publishing is configured on npmjs.com for both packages:
#    GitHub Actions, repository `annetaan/leko`, workflow `release.yml`, no
#    environment.
# 3. The repository is public. npm's provenance refuses a private source
#    repository.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Codegen carrying the same version is `check:pack`'s to check, inside
      # `ci` and before `publish`: CONTRIBUTING.md, **What `@annetaan/leko` ships**.
      - name: Check the tag names the version
        shell: bash
        run: |
          version=$(node -p "require('./packages/leko/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME and packages/leko/package.json is at $version."
            exit 1
          fi
          case $version in
            *-*)
              echo "$version is a prerelease. npm publishes one only under a --tag, and nothing here picks one yet."
              exit 1
              ;;
          esac

  ci:
    needs: check-tag
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v5
        with:
          # Written out, since there is no `.node-version` without a checkout.
          node-version: 24
          registry-url: https://registry.npmjs.org
      # The first npm that does the OIDC exchange with the registry.
      - run: npm install -g npm@^11.5.1
      - uses: actions/download-artifact@v8
        with:
          name: tarballs
          path: tarballs
      # Why the order and the skip: CONTRIBUTING.md, **The release**. `npm view`
      # exits 1 (E404) on a version that is not there, and the path starts `./`
      # because npm reads `tarballs/<file>` as a GitHub repository's `owner/name`.
      - name: Publish both tarballs
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          for name in leko leko-codegen; do
            if npm view "@annetaan/$name@$version" version >/dev/null 2>&1; then
              echo "@annetaan/$name@$version is on the registry already; skipping it"
              continue
            fi
            npm publish "./tarballs/annetaan-$name-$version.tgz" --provenance --access public
          done

  smoke:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # The runner's own npm, since the action sets up Node only after this.
      - name: Wait for the registry to serve both versions
        id: registry
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          for try in $(seq 30); do
            if npm view "@annetaan/leko@$version" version >/dev/null 2>&1 &&
              npm view "@annetaan/leko-codegen@$version" version >/dev/null 2>&1; then
              echo "version=$version" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Try $try: the registry does not serve both at $version yet"
            sleep 10
          done
          exit 1
      - uses: ./.github/actions/smoke
        with:
          specs: '@annetaan/leko@${{ steps.registry.outputs.version }} @annetaan/leko-codegen@${{ steps.registry.outputs.version }}'
