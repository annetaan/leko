name: Smoke
description: Install both packages into the smoke project and run its tests.
# CONTRIBUTING.md, **The smoke project** says what this asks of the packages
# and what each step catches. The caller checks the repository out first.

inputs:
  specs:
    description: >-
      What `npm install --no-save` installs into `smoke/`: the two tarball
      paths relative to `smoke/`, or two registry specs.
    required: true
  typescript:
    description: >-
      Empty keeps the TypeScript `smoke/package.json` pins. `7` installs the
      TypeScript 7 that `@annetaan/leko-codegen` runs its own tests on, the
      spec of its `typescript-7` devDependency, in the same install as the
      packages.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: npm
        cache-dependency-path: smoke/package-lock.json
    - name: Install the smoke project
      shell: bash
      working-directory: smoke
      run: npm ci
    - name: Install both packages, and TypeScript when asked
      shell: bash
      working-directory: smoke
      env:
        SPECS: ${{ inputs.specs }}
        TYPESCRIPT: ${{ inputs.typescript }}
      # After `npm ci`, never before, and in one install: CONTRIBUTING.md,
      # **The smoke project**. Unquoted so the shell splits the specs and
      # expands a glob.
      run: |
        case $TYPESCRIPT in
          '') extra= ;;
          7) extra=$(node -p "require('../packages/codegen/package.json').devDependencies['typescript-7'].replace(/^npm:/, '')") ;;
          *)
            echo "typescript is '$TYPESCRIPT'; it takes '' or '7'."
            exit 1
            ;;
        esac
        npm install --no-save $SPECS $extra
    - name: Install Chromium
      shell: bash
      working-directory: smoke
      run: npx playwright install --with-deps chromium
    - name: Run the smoke tests
      shell: bash
      working-directory: smoke
      run: npm test
    - name: Check the generated vocabulary was written back unchanged
      shell: bash
      working-directory: smoke
      run: git diff --exit-code
